# The landing page in site/ is published by the Website workflow on main (the github-pages
# environment only accepts deployments from the default branch). On this branch the same
# workflow just asks main's copy to publish the site from here whenever site/ changes.
name: Website

on:
  push:
    branches-ignore: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to publish the site from"
        required: false
        default: startrek-game

permissions:
  actions: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Ask main to publish this branch's site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="${GITHUB_REF_NAME}"
