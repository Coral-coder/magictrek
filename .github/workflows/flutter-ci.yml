# Checks every pull request and feature branch: analyzer, the engine and networking tests, an
# Android debug APK (kept as an artifact for sideloading) and an unsigned iOS build.
name: Flutter CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The NDK (path_provider's jni dependency compiles C with it) is ~700 MB that Gradle
      # would download on every fresh runner, and that download arrives corrupt now and then.
      # Keep it in the Actions cache; on a miss install it with retries.
      - name: Android NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-28.2.13676358
      - name: Install the NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for attempt in 1 2 3 4 5; do
            rm -rf "$sdk/ndk/28.2.13676358"
            if yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > "$RUNNER_TEMP/ndk.log" 2>&1 \
               && [ -f "$sdk/ndk/28.2.13676358/source.properties" ]; then
              echo "NDK installed on attempt $attempt"; exit 0
            fi
            echo "::warning::NDK install failed on attempt $attempt"; tail -3 "$RUNNER_TEMP/ndk.log"; sleep 10
          done
          exit 1
      - name: Build the debug APK
        run: |
          # The NDK the SDK fetches on first use sometimes arrives corrupt ("Error reading Zip
          # content from a SeekableByteChannel"); drop the half-installed copy and go again.
          set -o pipefail
          ok=false
          for attempt in 1 2 3; do
            if flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/apk.log"; then ok=true; break; fi
            grep -q "Error reading Zip content\|preparing SDK package NDK" "$RUNNER_TEMP/apk.log" || break
            echo "::warning::The NDK download was corrupt; retrying (attempt $attempt failed)"
            rm -rf "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/28*
          done
          [ "$ok" = true ]
      - uses: actions/upload-artifact@v4
        with:
          name: magictrek-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
