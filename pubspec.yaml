name: magictrek
description: "Multiplayer Magic-style card battles across the final frontier, in an LCARS interface."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  convert: ^3.1.2
  crypto: ^3.0.7
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.2
  web_socket_channel: ^3.0.3
  nostr: ^2.0.0
  bluetooth_low_energy: ^6.2.1
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards.json
    - assets/images/
