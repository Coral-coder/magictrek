# XcodeGen project definition. `xcodegen generate` makes MagicTrek.xcodeproj (git-ignored);
# the TestFlight workflow does this on the runner. The rules engine lives in Packages/MagicTrekCore.
name: MagicTrek
options:
  bundleIdPrefix: com.coralcoder
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    APP_BUNDLE_ID: com.coralcoder.magictrek
packages:
  MagicTrekCore:
    path: Packages/MagicTrekCore
targets:
  MagicTrek:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MagicTrek
        excludes: ["Info.plist"]
      - path: ../cards
        type: folder
        buildPhase: resources
    dependencies:
      - package: MagicTrekCore
        product: CardKit
      - package: MagicTrekCore
        product: GameEngine
    info:
      path: MagicTrek/Info.plist
      properties:
        CFBundleDisplayName: MagicTrek
        CFBundleName: MagicTrek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        NSUserNotificationsUsageDescription: MagicTrek tells you when it is your turn.
    entitlements:
      path: MagicTrek/MagicTrek.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.$(APP_BUNDLE_ID)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  MagicTrek:
    build:
      targets:
        MagicTrek: all
    run:
      config: Debug
    archive:
      config: Release
